output_dir: outputs/runs

run:
  name: pointwise_v0
  mode: pointwise

model:
  backend: encoder
  name_or_path: roberta-base
  max_length: 512
  dropout: 0.1
  gradient_checkpointing: true

data:
  nodes_dir: data/processed/nodes_v0
  max_train_nodes: 47852
  max_val_nodes: 5751

training:
  seed: 42
  device: auto
  mixed_precision: fp16
  batch_size: 2
  eval_batch_size: 8
  gradient_accumulation_steps: 16
  epochs: 3
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  num_workers: 0
  log_every: 100
  max_steps_per_epoch: null
  max_validation_batches: null
