runs_dir: outputs/qwen_lora_runs

data:
  nodes_dir: data/processed/nodes_v0
  pointwise_dir: data/processed/pointwise
  trajectories_dir: data/processed/trajectories

evaluation:
  # Exploratory only: every available best.pt happens to be epoch 1 in V0.
  # This does not replace the pre-registered fixed-final-epoch evaluation.
  checkpoint: best
  metrics_filename: metrics_best_epoch1_exploratory.json
  summary_filename: v0_best_epoch1_exploratory_summary.json
  seed: 42
  selection_seed: 42
  device: auto
  mixed_precision: bf16
  batch_size: 24
  num_workers: 4
  max_nodes: null
  max_pointwise_examples: null
  max_trajectories: null
  threshold_candidates: 201
  bootstrap_samples: 1000
  report_full_pointwise: false
