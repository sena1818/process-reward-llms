runs_dir: outputs/qwen_lora_runs

data:
  nodes_dir: data/processed/nodes_v0
  pointwise_dir: data/processed/pointwise
  trajectories_dir: data/processed/trajectories

evaluation:
  seed: 42
  selection_seed: 42
  device: auto
  mixed_precision: bf16
  # Fixed final epoch for every objective. "best" would select the epoch by
  # each run's own validation objective, which is a different quantity for
  # pointwise, pairwise, and each hybrid lambda.
  checkpoint: last
  # Forward-only work, so this can be much larger than the training batch.
  batch_size: 24
  num_workers: 4
  max_nodes: null
  max_pointwise_examples: null
  max_trajectories: null
  threshold_candidates: 201
  bootstrap_samples: 1000
  report_full_pointwise: false
