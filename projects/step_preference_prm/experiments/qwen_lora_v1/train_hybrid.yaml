# Confirmatory protocol: fixed one-epoch budget, distinct from archived V0.
output_dir: outputs/qwen_lora_v1_runs

lambda_sweep:
  - 0.1
  - 0.3
  - 0.5
  - 1.0

run:
  name: qwen_lora_hybrid_v1
  mode: hybrid

model:
  backend: causal_lora
  name_or_path: Qwen/Qwen2.5-Math-1.5B
  max_length: 2048
  dropout: 0.05
  gradient_checkpointing: true
  load_dtype: bf16
  packing:
    max_problem_tokens: 384
    max_candidate_tokens: 512
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear
    bias: "none"

data:
  nodes_dir: data/processed/nodes_v0
  max_train_nodes: 47852
  max_val_nodes: 5751

training:
  seed: 42
  device: auto
  mixed_precision: bf16
  batch_size: 2
  eval_batch_size: 4
  gradient_accumulation_steps: 16
  epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  num_workers: 4
  log_every: 25
  # Diagnostic curve only; checkpoint selection stays fixed final epoch.
  eval_every_optimizer_steps: 150
  max_steps_per_epoch: null
  max_validation_batches: null
