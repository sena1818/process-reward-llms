runs_dir: outputs/qwen_lora_v1_runs

data:
  nodes_dir: data/processed/nodes_v0
  pointwise_dir: data/processed/pointwise
  trajectories_dir: data/processed/trajectories

evaluation:
  seed: 42
  selection_seed: 42
  device: auto
  mixed_precision: bf16
  checkpoint: last
  batch_size: 24
  num_workers: 4
  max_nodes: null
  max_pointwise_examples: null
  max_trajectories: null
  threshold_candidates: 201
  bootstrap_samples: 1000
  report_full_pointwise: false
  # This benchmark's first-error-within-1 measure is degenerate, so exclude
  # it from V1 evaluation and report the complete lambda response instead.
  report_first_error: false
  save_scores: true
  metrics_filename: metrics.json
  summary_filename: v1_summary.json
  selection_rule: report_all
